# publish-ci-binaries.yml — build + publish the prebuilt linter binaries that
# the universal swift-ci.yml downloads (R1 follow-up ruling 2026-07-20).
#
# WHY
# The universal CI's swift-linter job previously baked the dispatcher and the
# "standard runner" per consumer repo via actions/cache. Actions caches are
# repository-scoped, so ~450 consumer repos each paid their own ~310-560s
# bake after every engine/rule-pack commit (measured 2026-07-20: 18 of 28
# runs cold, median job 502s). This workflow builds ONCE, here, and publishes
# the binaries as assets on the rolling `ci-binaries` release; every consumer
# downloads warm.
#
# RELEASE SHAPE (approved 2026-07-20)
# - Single fixed tag `ci-binaries`, created once, NEVER moved (no force-push;
#   the tag's commit is not meaningful). Marked prerelease, never `latest`.
#   Non-semver → invisible to SwiftPM version resolution and SPI; the package
#   remains untagged in the release sense.
# - Assets, replaced in place on every publish: one baked `swift-linter`,
#   `RULE-INVENTORY.json`, `MANIFEST.json`, and `SHA256SUMS` covering them all.
# - Binaries are built inside the exact Swift 6.4 release-floor image used by
#   the universal swift-linter job — for ABI/runtime compatibility. Bump the
#   digest in lockstep with the universal reusable's release-floor pin.
#
# PUBLICATION BARRIER (Chair LINTER-PUBLICATION-BARRIER-1, 2026-10-05)
# Building and controlling never publish. Both platform binaries are built and
# put through the runner controls first (build-linux, build-macos-arm64), each
# handing its exact staged files to the publish job as a checksummed artifact.
# The publish job runs only on workflow_dispatch with `publish: true`, only
# when BOTH builds and their controls succeeded, and it uploads exactly those
# artifacts after re-verifying their checksums and identities; it never
# rebuilds and never reuses a previously published asset. push and a dispatch
# without `publish: true` stop after the controls.
#
# FRESHNESS
# push-to-main builds and controls always. Rule-pack pushes arrive as
# workflow_dispatch within ~1 min: each of the five rule-pack repos calls
# swift-institute/.github's notify-linter-republish.yml reusable on push to
# main, which mints a swift-institute-bot App token (actions:write, this repo
# only) and runs `gh workflow run` here (2026-07-20, instant-republish
# handoff); without `publish: true` that run builds and controls only. There
# is no schedule: a verified but deliberately unpublished digest must not
# trigger identical rebuilds (Chair, 2026-10-05).

name: publish-ci-binaries

# [CI-090] standalone workflow: deny-all floor; per-job grants below.
permissions: {}

# [CI-082] pinned digest for the gh CLI apt keyring (same pin as
# swift-institute/.github's submit-dep-graph-weekly.yml; re-lock on rotation).
env:
  GH_KEYRING_SHA256: "6084d5d7bd8e288441e0e94fc6275570895da18e6751f70f057485dc2d1a811b"
  SWIFT_RELEASE_FLOOR_IMAGE: "swiftlang/swift@sha256:8d614165059587ce9dcf6727a76aeff4cbf1cde41fde9a9281a43803be736224"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: Replace the ci-binaries release assets with the binaries this run builds and controls.
        type: boolean
        default: false

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container: swiftlang/swift@sha256:8d614165059587ce9dcf6727a76aeff4cbf1cde41fde9a9281a43803be736224
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      binary-sha256: ${{ steps.stage.outputs.binary-sha256 }}
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      # [CI-092]: the Swift image ships no curl/gh; libuuid is needed by the dependency
      # graph (swift-linux-standard's CLinuxKernelShim).
      - name: Install system dependencies (curl, gh, uuid-dev)
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -qq -y curl ca-certificates gnupg uuid-dev git jq
          install -d -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /tmp/gh-keyring.gpg
          echo "${GH_KEYRING_SHA256}  /tmp/gh-keyring.gpg" | sha256sum -c -
          mv /tmp/gh-keyring.gpg /etc/apt/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
          apt-get update -qq
          apt-get install -qq -y gh

      - name: Configure private-dep access
        uses: swift-institute/.github/.github/actions/configure-private-repos@a7d550952f7574c09b181d31b2a6c9c719b57f8b  # main 2026-10-03, mints for swift-molecules and swift-compositions
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          app-client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          app-private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          enabled: true

      # Composite digest: same coordinate the old per-repo cache keyed on —
      # engine HEAD + the standard rule-pack main HEADs baked into the runner.
      - name: Compute composite digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          engine="$GITHUB_SHA"
          primrules=$(git ls-remote https://github.com/swift-molecules/swift-primitives-linter-rules.git main | cut -f1)
          stdrules=$(git ls-remote https://github.com/swift-standards/swift-standards-linter-rules.git main | cut -f1)
          instrules=$(git ls-remote https://github.com/swift-compositions/swift-institute-linter-rules.git main | cut -f1)
          unirules=$(git ls-remote https://github.com/swift-compositions/swift-linter-rules.git main | cut -f1)
          lint=$(git ls-remote https://github.com/swift-molecules/swift-lint.git main | cut -f1)
          digest=$(printf '%s\n' "$engine" "$primrules" "$stdrules" "$instrules" "$unirules" "$lint" | sort | sha256sum | cut -d' ' -f1)
          {
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
          {
            echo "digest=$digest"
            echo "engine=$engine"
            echo "swift-primitives-linter-rules=$primrules"
            echo "swift-standards-linter-rules=$stdrules"
            echo "swift-institute-linter-rules=$instrules"
            echo "swift-linter-rules=$unirules"
            echo "swift-linter=$engine"
            echo "swift-lint=$lint"
            echo "built-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "swift-image=${SWIFT_RELEASE_FLOOR_IMAGE}"
          } > /tmp/MANIFEST.txt
          cat /tmp/MANIFEST.txt

      - name: Build structured linter
        shell: bash
        run: |
          set -euo pipefail
          swift build --package-path Runner --product runner -Xswiftc -Xfrontend -Xswiftc -disable-round-trip-debug-types
          resolved=Runner/Package.resolved
          require_revision() {
            identity="$1"
            expected="$2"
            actual=$(jq -r --arg identity "$identity" '.pins[] | select(.identity == $identity) | .state.revision' "$resolved")
            if [ "$actual" != "$expected" ]; then
              echo "$identity resolved to $actual, expected $expected" >&2
              exit 1
            fi
          }
          require_revision swift-linter "$(sed -n 's/^swift-linter=//p' /tmp/MANIFEST.txt)"
          require_revision swift-primitives-linter-rules "$(sed -n 's/^swift-primitives-linter-rules=//p' /tmp/MANIFEST.txt)"
          require_revision swift-standards-linter-rules "$(sed -n 's/^swift-standards-linter-rules=//p' /tmp/MANIFEST.txt)"
          require_revision swift-institute-linter-rules "$(sed -n 's/^swift-institute-linter-rules=//p' /tmp/MANIFEST.txt)"
          require_revision swift-linter-rules "$(sed -n 's/^swift-linter-rules=//p' /tmp/MANIFEST.txt)"
          require_revision swift-lint "$(sed -n 's/^swift-lint=//p' /tmp/MANIFEST.txt)"
          install -m 0755 Runner/.build/debug/runner /tmp/stage-swift-linter
          /tmp/stage-swift-linter --inventory > /tmp/RULE-INVENTORY.json
          jq -e '
            .schema == 1
            and .profileSchema == 1
            and .structuredResultSchema == 2
            and (.bundles | length > 0)
            and ([.bundles[].bundle] | length == (unique | length))
            and all(.bundles[]; .rules as $rules
              | ($rules | length) > 0
              and (($rules | length) == ($rules | unique | length)))
          ' /tmp/RULE-INVENTORY.json >/dev/null

      - name: Runner controls (before publication)
        shell: bash
        run: |
          set -- /tmp/stage-swift-linter Tests/Fixtures/runner-controls
          set -uo pipefail
          binary=$1
          fixtures=$(cd "$2" && pwd)
          failures=0
          check() {
            if [ "$2" = "$3" ]; then
              echo "runner control $1: $3"
            else
              echo "::error::runner control $1: expected $2, got $3"
              failures=$((failures + 1))
            fi
          }
          digest=$( (sha256sum "$binary" 2>/dev/null || shasum -a 256 "$binary") | cut -d' ' -f1)
          echo "runner under control: $binary sha256 $digest engine ${GITHUB_SHA:-unknown}"
          status=0
          "$binary" --inventory > /dev/null || status=$?
          check "inventory exit" 0 "$status"
          for bundle in institute primitives standards; do
            for case in error:1 clean:0 unmeasured:2; do
              fixture=${case%%:*}
              expected=${case##*:}
              status=0
              report=$(cd "$fixtures/$fixture" && SWIFT_LINTER_BUNDLE=$bundle SWIFT_LINTER_EXIT_POLICY=strict SWIFT_LINTER_FORMAT=structured "$binary" .) || status=$?
              check "$bundle $fixture exit" "$expected" "$status"
              check "$bundle $fixture failed controls" 0 "$(jq '.summary.failedControls' <<< "$report")"
              check "$bundle $fixture unmeasured controls" 0 "$(jq '.summary.unmeasuredControls' <<< "$report")"
              case $fixture in
                error) check "$bundle error impl finding" 1 "$(jq '[.findings[] | select(.rule == "variable named impl" and .severity == "error")] | length' <<< "$report")" ;;
                clean) check "$bundle clean findings" 0 "$(jq '.summary.findings' <<< "$report")" ;;
                unmeasured) check "$bundle unmeasured observations present" true "$(jq '.summary.unmeasuredObservations > 0' <<< "$report")" ;;
              esac
            done
          done
          for channel in unset invalid; do
            status=0
            if [ "$channel" = unset ]; then
              (cd "$fixtures/error" && env -u SWIFT_LINTER_BUNDLE SWIFT_LINTER_EXIT_POLICY=strict "$binary" . > /dev/null 2>&1) || status=$?
            else
              (cd "$fixtures/error" && SWIFT_LINTER_BUNDLE=institutez SWIFT_LINTER_EXIT_POLICY=strict "$binary" . > /dev/null 2>&1) || status=$?
            fi
            check "bundle $channel exit" 1 "$status"
          done
          [ "$failures" -eq 0 ] || { echo "::error::$failures runner control(s) failed; not publishing"; exit 1; }
          echo "all runner controls passed"

      - name: Stage controlled Linux assets
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          stage=/tmp/stage-linux
          mkdir -p "$stage"
          cp /tmp/stage-swift-linter "$stage/swift-linter"
          cp /tmp/RULE-INVENTORY.json "$stage/RULE-INVENTORY.json"
          jq -n \
            --arg platform "linux-x86_64" \
            --arg toolchain "${SWIFT_RELEASE_FLOOR_IMAGE}" \
            --arg compositeDigest "${{ steps.digest.outputs.digest }}" \
            --arg engine "$GITHUB_SHA" \
            --arg primitiveRules "$(sed -n 's/^swift-primitives-linter-rules=//p' /tmp/MANIFEST.txt)" \
            --arg standardRules "$(sed -n 's/^swift-standards-linter-rules=//p' /tmp/MANIFEST.txt)" \
            --arg instituteRules "$(sed -n 's/^swift-institute-linter-rules=//p' /tmp/MANIFEST.txt)" \
            --arg universalRules "$(sed -n 's/^swift-linter-rules=//p' /tmp/MANIFEST.txt)" \
            --arg linter "$(sed -n 's/^swift-linter=//p' /tmp/MANIFEST.txt)" \
            --arg lint "$(sed -n 's/^swift-lint=//p' /tmp/MANIFEST.txt)" \
            '{schema:1, platform:$platform, toolchain:$toolchain,
              compositeDigest:$compositeDigest, engineRevision:$engine,
              packageRevisions:{"swift-primitives-linter-rules":$primitiveRules,
                "swift-standards-linter-rules":$standardRules,
                "swift-institute-linter-rules":$instituteRules,
                "swift-linter-rules":$universalRules,
                "swift-linter":$linter,
                "swift-lint":$lint}}' > "$stage/MANIFEST.json"
          (cd "$stage" && sha256sum swift-linter RULE-INVENTORY.json MANIFEST.json > SHA256SUMS)
          echo "binary-sha256=$(sha256sum "$stage/swift-linter" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Hand the controlled Linux assets to the publication barrier
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-binaries-linux-x86_64
          path: /tmp/stage-linux/
          if-no-files-found: error
          retention-days: 7

  # macos-arm64 leg (task #17, 2026-07-23): same rolling release, suffixed
  # assets (`swift-linter-macos-arm64`, `swift-linter-runner-macos-arm64`) with
  # their own MANIFEST-macos-arm64.txt + SHA256SUMS-macos-arm64 so the Linux
  # assets and their consumer download step stay byte-for-byte untouched.
  # Consumer: the LOCAL coordinator's download-first path (swift-build lint,
  # [PKG-BUILD-025]) — when local mirror HEADs equal this manifest's HEADs it
  # downloads instead of baking (~33 min saved per digest move per machine).
  # Debug, not release, matching the Linux leg (swiftlang/swift#89617 is
  # release-only). windows-x64 was evaluated and SKIPPED: the universal's
  # swift-linter job is ubuntu-only and no CI leg lints on Windows, so a
  # Windows asset would have zero consumers (negative recorded 2026-07-23).
  # Serialized after the Linux build, as before; it no longer publishes.
  build-macos-arm64:
    needs: build-linux
    runs-on: ${{ 'xcode-27' }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      XCODE_VERSION: "27.1"   # lockstep with the universal swift-ci.yml env
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      binary-sha256: ${{ steps.stage.outputs.binary-sha256 }}
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Configure private-dep access
        uses: swift-institute/.github/.github/actions/configure-private-repos@a7d550952f7574c09b181d31b2a6c9c719b57f8b  # main 2026-10-03, mints for swift-molecules and swift-compositions
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          app-client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          app-private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          enabled: true

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Compute composite digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          engine="$GITHUB_SHA"
          primrules=$(git ls-remote https://github.com/swift-molecules/swift-primitives-linter-rules.git main | cut -f1)
          stdrules=$(git ls-remote https://github.com/swift-standards/swift-standards-linter-rules.git main | cut -f1)
          instrules=$(git ls-remote https://github.com/swift-compositions/swift-institute-linter-rules.git main | cut -f1)
          unirules=$(git ls-remote https://github.com/swift-compositions/swift-linter-rules.git main | cut -f1)
          lint=$(git ls-remote https://github.com/swift-molecules/swift-lint.git main | cut -f1)
          digest=$(printf '%s\n' "$engine" "$primrules" "$stdrules" "$instrules" "$unirules" "$lint" | sort | shasum -a 256 | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "digest=$digest"
            echo "engine=$engine"
            echo "swift-primitives-linter-rules=$primrules"
            echo "swift-standards-linter-rules=$stdrules"
            echo "swift-institute-linter-rules=$instrules"
            echo "swift-linter-rules=$unirules"
            echo "swift-linter=$engine"
            echo "swift-lint=$lint"
            echo "built-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "platform=macos-arm64"
            echo "xcode=${XCODE_VERSION}"
          } > /tmp/MANIFEST-macos-arm64.txt
          cat /tmp/MANIFEST-macos-arm64.txt

      - name: Build structured linter
        shell: bash
        run: |
          set -euo pipefail
          swift build --package-path Runner --product runner
          resolved=Runner/Package.resolved
          require_revision() {
            identity="$1"
            expected="$2"
            actual=$(jq -r --arg identity "$identity" '.pins[] | select(.identity == $identity) | .state.revision' "$resolved")
            if [ "$actual" != "$expected" ]; then
              echo "$identity resolved to $actual, expected $expected" >&2
              exit 1
            fi
          }
          require_revision swift-linter "$(sed -n 's/^swift-linter=//p' /tmp/MANIFEST-macos-arm64.txt)"
          require_revision swift-primitives-linter-rules "$(sed -n 's/^swift-primitives-linter-rules=//p' /tmp/MANIFEST-macos-arm64.txt)"
          require_revision swift-standards-linter-rules "$(sed -n 's/^swift-standards-linter-rules=//p' /tmp/MANIFEST-macos-arm64.txt)"
          require_revision swift-institute-linter-rules "$(sed -n 's/^swift-institute-linter-rules=//p' /tmp/MANIFEST-macos-arm64.txt)"
          require_revision swift-linter-rules "$(sed -n 's/^swift-linter-rules=//p' /tmp/MANIFEST-macos-arm64.txt)"
          require_revision swift-lint "$(sed -n 's/^swift-lint=//p' /tmp/MANIFEST-macos-arm64.txt)"
          install -m 0755 Runner/.build/debug/runner /tmp/stage-swift-linter-macos-arm64

      - name: Runner controls (before publication)
        shell: bash
        run: |
          set -- /tmp/stage-swift-linter-macos-arm64 Tests/Fixtures/runner-controls
          set -uo pipefail
          binary=$1
          fixtures=$(cd "$2" && pwd)
          failures=0
          check() {
            if [ "$2" = "$3" ]; then
              echo "runner control $1: $3"
            else
              echo "::error::runner control $1: expected $2, got $3"
              failures=$((failures + 1))
            fi
          }
          digest=$( (sha256sum "$binary" 2>/dev/null || shasum -a 256 "$binary") | cut -d' ' -f1)
          echo "runner under control: $binary sha256 $digest engine ${GITHUB_SHA:-unknown}"
          status=0
          "$binary" --inventory > /dev/null || status=$?
          check "inventory exit" 0 "$status"
          for bundle in institute primitives standards; do
            for case in error:1 clean:0 unmeasured:2; do
              fixture=${case%%:*}
              expected=${case##*:}
              status=0
              report=$(cd "$fixtures/$fixture" && SWIFT_LINTER_BUNDLE=$bundle SWIFT_LINTER_EXIT_POLICY=strict SWIFT_LINTER_FORMAT=structured "$binary" .) || status=$?
              check "$bundle $fixture exit" "$expected" "$status"
              check "$bundle $fixture failed controls" 0 "$(jq '.summary.failedControls' <<< "$report")"
              check "$bundle $fixture unmeasured controls" 0 "$(jq '.summary.unmeasuredControls' <<< "$report")"
              case $fixture in
                error) check "$bundle error impl finding" 1 "$(jq '[.findings[] | select(.rule == "variable named impl" and .severity == "error")] | length' <<< "$report")" ;;
                clean) check "$bundle clean findings" 0 "$(jq '.summary.findings' <<< "$report")" ;;
                unmeasured) check "$bundle unmeasured observations present" true "$(jq '.summary.unmeasuredObservations > 0' <<< "$report")" ;;
              esac
            done
          done
          for channel in unset invalid; do
            status=0
            if [ "$channel" = unset ]; then
              (cd "$fixtures/error" && env -u SWIFT_LINTER_BUNDLE SWIFT_LINTER_EXIT_POLICY=strict "$binary" . > /dev/null 2>&1) || status=$?
            else
              (cd "$fixtures/error" && SWIFT_LINTER_BUNDLE=institutez SWIFT_LINTER_EXIT_POLICY=strict "$binary" . > /dev/null 2>&1) || status=$?
            fi
            check "bundle $channel exit" 1 "$status"
          done
          [ "$failures" -eq 0 ] || { echo "::error::$failures runner control(s) failed; not publishing"; exit 1; }
          echo "all runner controls passed"

      - name: Stage controlled macos-arm64 assets
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          stage=/tmp/stage-macos-arm64
          mkdir -p "$stage"
          cp /tmp/stage-swift-linter-macos-arm64 "$stage/swift-linter-macos-arm64"
          "$stage/swift-linter-macos-arm64" --inventory > "$stage/RULE-INVENTORY-macos-arm64.json"
          jq -e '
            .schema == 1
            and .profileSchema == 1
            and .structuredResultSchema == 2
            and (.bundles | length > 0)
            and ([.bundles[].bundle] | length == (unique | length))
            and all(.bundles[]; .rules as $rules
              | ($rules | length) > 0
              and (($rules | length) == ($rules | unique | length)))
          ' "$stage/RULE-INVENTORY-macos-arm64.json" >/dev/null
          jq -n \
            --arg platform "macos-arm64" \
            --arg toolchain "$(/usr/bin/xcodebuild -version | tr '\n' ';')" \
            --arg compositeDigest "${{ steps.digest.outputs.digest }}" \
            --arg engine "$GITHUB_SHA" \
            --arg primitiveRules "$(sed -n 's/^swift-primitives-linter-rules=//p' /tmp/MANIFEST-macos-arm64.txt)" \
            --arg standardRules "$(sed -n 's/^swift-standards-linter-rules=//p' /tmp/MANIFEST-macos-arm64.txt)" \
            --arg instituteRules "$(sed -n 's/^swift-institute-linter-rules=//p' /tmp/MANIFEST-macos-arm64.txt)" \
            --arg universalRules "$(sed -n 's/^swift-linter-rules=//p' /tmp/MANIFEST-macos-arm64.txt)" \
            --arg linter "$(sed -n 's/^swift-linter=//p' /tmp/MANIFEST-macos-arm64.txt)" \
            --arg lint "$(sed -n 's/^swift-lint=//p' /tmp/MANIFEST-macos-arm64.txt)" \
            '{schema:1, platform:$platform, toolchain:$toolchain,
              compositeDigest:$compositeDigest, engineRevision:$engine,
              packageRevisions:{"swift-primitives-linter-rules":$primitiveRules,
                "swift-standards-linter-rules":$standardRules,
                "swift-institute-linter-rules":$instituteRules,
                "swift-linter-rules":$universalRules,
                "swift-linter":$linter,
                "swift-lint":$lint}}' > "$stage/MANIFEST-macos-arm64.json"
          (cd "$stage" && shasum -a 256 swift-linter-macos-arm64 RULE-INVENTORY-macos-arm64.json MANIFEST-macos-arm64.json > SHA256SUMS-macos-arm64)
          echo "binary-sha256=$(shasum -a 256 "$stage/swift-linter-macos-arm64" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Hand the controlled macos-arm64 assets to the publication barrier
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-binaries-macos-arm64
          path: /tmp/stage-macos-arm64/
          if-no-files-found: error
          retention-days: 7

  # The single publication barrier: both platforms built AND controlled in this
  # run, an explicit opt-in, and the exact controlled files re-verified before
  # any release asset is created or replaced.
  publish:
    needs: [build-linux, build-macos-arm64]
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      && inputs.publish
      && needs.build-linux.result == 'success'
      && needs.build-macos-arm64.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # release asset upload on this repo
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Receive the controlled Linux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-binaries-linux-x86_64
          path: stage-linux

      - name: Receive the controlled macos-arm64 assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-binaries-macos-arm64
          path: stage-macos-arm64

      - name: Verify both receipts
        shell: bash
        env:
          LINUX_DIGEST: ${{ needs.build-linux.outputs.digest }}
          MACOS_DIGEST: ${{ needs.build-macos-arm64.outputs.digest }}
          LINUX_BINARY_SHA256: ${{ needs.build-linux.outputs.binary-sha256 }}
          MACOS_BINARY_SHA256: ${{ needs.build-macos-arm64.outputs.binary-sha256 }}
        run: |
          set -euo pipefail
          (cd stage-linux && sha256sum -c SHA256SUMS)
          (cd stage-macos-arm64 && sha256sum -c SHA256SUMS-macos-arm64)
          test "$(sha256sum stage-linux/swift-linter | cut -d' ' -f1)" = "$LINUX_BINARY_SHA256"
          test "$(sha256sum stage-macos-arm64/swift-linter-macos-arm64 | cut -d' ' -f1)" = "$MACOS_BINARY_SHA256"
          test "$LINUX_DIGEST" = "$MACOS_DIGEST"
          test "$(jq -r .compositeDigest stage-linux/MANIFEST.json)" = "$LINUX_DIGEST"
          test "$(jq -r .compositeDigest stage-macos-arm64/MANIFEST-macos-arm64.json)" = "$MACOS_DIGEST"
          test "$(jq -r .engineRevision stage-linux/MANIFEST.json)" = "$GITHUB_SHA"
          test "$(jq -r .engineRevision stage-macos-arm64/MANIFEST-macos-arm64.json)" = "$GITHUB_SHA"
          echo "both controlled artifacts verified: linux $LINUX_BINARY_SHA256, macos-arm64 $MACOS_BINARY_SHA256, digest $LINUX_DIGEST"

      - name: Publish rolling ci-binaries release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.build-linux.outputs.digest }}
        run: |
          set -euo pipefail
          if ! gh release view ci-binaries >/dev/null 2>&1; then
            # One-time tag+release creation; the tag is never moved afterwards
            # (provenance lives in MANIFEST.json, not the tag commit).
            gh release create ci-binaries \
              --prerelease --latest=false \
              --title "CI binaries (rolling)" \
              --notes "Rolling prebuilt linter binaries for the universal swift-ci.yml. Non-semver tag: not a package release. See MANIFEST.json for the exact source revisions of this build." \
              --target "$GITHUB_SHA"
          fi
          gh release upload ci-binaries \
            stage-linux/swift-linter stage-linux/RULE-INVENTORY.json \
            stage-linux/MANIFEST.json stage-linux/SHA256SUMS --clobber
          gh release upload ci-binaries \
            stage-macos-arm64/swift-linter-macos-arm64 stage-macos-arm64/RULE-INVENTORY-macos-arm64.json \
            stage-macos-arm64/MANIFEST-macos-arm64.json stage-macos-arm64/SHA256SUMS-macos-arm64 --clobber
          gh release edit ci-binaries \
            --notes "Rolling prebuilt linter binaries for the universal swift-ci.yml (updated $(date -u +%Y-%m-%dT%H:%M:%SZ)). Non-semver tag: not a package release. digest=$DIGEST"
          echo "Published digest $DIGEST."
